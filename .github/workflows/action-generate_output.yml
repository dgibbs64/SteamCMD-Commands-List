# This workflow generates the output and pushes it to main branch

name: Generate Output

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    paths:
      - "steamcmd_commands.sh"
      - ".github/scripts/summarise_changes.sh"
      - ".github/workflows/action-generate_output.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1.3.0

      - name: Run steamcmd_commands.sh
        run: ./steamcmd_commands.sh

      - name: Summarise changes
        id: changes
        run: .github/scripts/summarise_changes.sh

      - name: Add and commit changes
        if: github.event_name != 'pull_request' && steps.changes.outputs.message != ''
        uses: EndBug/add-and-commit@v11
        with:
          fetch: false
          message: ${{ steps.changes.outputs.message }}
          push: true

  # Scheduled workflows are disabled after 60 days without repo activity,
  # and this one only commits when the SteamCMD output changes.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
